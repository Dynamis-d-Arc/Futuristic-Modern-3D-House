<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbis House</title>
<style>
  :root {
    --ink: #f5f0e8;
    --dim: rgba(245, 240, 232, .64);
    --glow: #ffdcaa;
    --panel: rgba(16, 18, 28, .5);
    --line: rgba(255, 255, 255, .16);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: #0c0e16; color: var(--ink);
    font: 15px/1.5 "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }

  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none;
    transition: transform 1.2s cubic-bezier(.6, 0, .2, 1); }
  #stage:focus { outline: none; }
  #stage:focus-visible { outline: 2px solid var(--glow); outline-offset: -4px; }
  .floor { fill: rgba(255, 220, 170, 0); stroke: rgba(255, 236, 205, 0); stroke-width: 2;
    vector-effect: non-scaling-stroke; cursor: pointer; transition: fill .25s, stroke .25s; }
  .floor.on { fill: rgba(255, 220, 170, .2); stroke: rgba(255, 236, 205, .95); filter: url(#glow); }
  #lead { stroke: rgba(255, 236, 205, .75); stroke-width: 1; vector-effect: non-scaling-stroke; pointer-events: none; }

  #brand { position: fixed; left: clamp(16px, 3vw, 48px); top: clamp(16px, 3vh, 36px); pointer-events: none;
    text-shadow: 0 1px 12px rgba(0, 0, 0, .5); }
  #brand b { display: block; font-size: 20px; font-weight: 600; letter-spacing: .32em; }
  .eyebrow { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--dim); }

  .frost { border: 1px solid var(--line); border-radius: 20px; background: var(--panel);
    -webkit-backdrop-filter: blur(18px) saturate(1.3); backdrop-filter: blur(18px) saturate(1.3); }
  #panel { position: fixed; right: clamp(16px, 3vw, 48px); top: 50%; transform: translateY(-50%);
    width: 330px; padding: 28px; }
  .num { font-size: 104px; line-height: 1; font-weight: 200; letter-spacing: -.02em;
    font-variant-numeric: tabular-nums; margin: 6px 0 10px -4px; }
  h1 { margin: 0; font-size: 23px; font-weight: 600; }
  .rooms { margin: 4px 0 0; color: var(--dim); }
  .note { margin: 12px 0 0; }
  dl { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; margin: 20px 0 0; padding-top: 18px;
    border-top: 1px solid var(--line); }
  dt { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
  dd { margin: 0; font-size: 17px; font-variant-numeric: tabular-nums; }
  button { font: inherit; color: #1b1407; background: var(--glow); border: 0; border-radius: 999px;
    padding: 11px 20px; font-weight: 600; cursor: pointer; }
  button:hover { background: #ffe9c8; }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  #enter { margin-top: 22px; width: 100%; }
  .ghost { display: block; margin-top: 10px; padding: 10px 20px; border: 1px solid var(--line); border-radius: 999px;
    color: var(--ink); text-align: center; text-decoration: none; font-weight: 600; }
  .ghost:hover { background: rgba(255, 255, 255, .1); }
  .ghost:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  #card .ghost, #back { display: inline-block; margin: 16px 8px 0 0; }
  .hint { margin: 12px 0 0; font-size: 12px; color: var(--dim); text-align: center; }
  #panel, #brand, #lead { transition: opacity .4s; }
  .zooming #panel, .zooming #brand, .zooming #lead { opacity: 0; pointer-events: none; }

  #room { position: fixed; inset: 0; background: #0c0e16; opacity: 0; visibility: hidden;
    transition: opacity .6s, visibility 0s .6s; }
  #room.open { opacity: 1; visibility: visible; transition: opacity .6s; }
  #room img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #card { position: absolute; left: clamp(16px, 3vw, 48px); bottom: clamp(16px, 4vh, 48px);
    width: min(360px, calc(100vw - 32px)); padding: 22px 24px; }
  #card .num { font-size: 64px; margin: 4px 0 6px -2px; }
  #back { margin-top: 16px; }

  /* Bottom sheet: set by fit() under 720 px wide, or when a side panel would cover the house. */
  .sheet #panel { left: 12px; right: 12px; top: auto; bottom: 12px; transform: none; width: auto;
    max-width: 560px; margin: 0 auto; padding: 16px 18px; }
  .sheet #panel .num { font-size: 56px; float: left; margin: 0 14px 0 -2px; }
  .sheet #panel .eyebrow, .sheet .note { display: none; }
  .sheet dl { clear: both; grid-template-columns: repeat(4, auto); margin-top: 12px; padding-top: 12px; gap: 6px 16px; }
  .sheet dd { font-size: 15px; }
  .sheet #enter { margin-top: 12px; }
  .sheet .hint { margin-top: 8px; }
  .sheet #lead { display: none; }
  .sheet #stage { -webkit-mask-image: linear-gradient(#000 88%, transparent); mask-image: linear-gradient(#000 88%, transparent); }
  @media (max-width: 480px) { .sheet dl { display: none; } }  /* keep the sheet short so level 1 stays visible */
  @media (prefers-reduced-motion: reduce) {
    #stage { transition: none; }
    #room, #room.open { transition: opacity .15s; }
    .floor, #panel, #brand, #lead { transition: none; }
  }
</style>
</head>
<body>

<svg id="stage" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" tabindex="0" role="slider"
     aria-label="Level of Orbis House" aria-orientation="vertical" aria-valuemin="1" aria-valuemax="3">
  <defs>
    <filter id="glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <image href="exterior.jpg" width="1920" height="1080"/>
  <line id="lead"/>
</svg>

<div id="brand"><b>ORBIS HOUSE</b><span class="eyebrow">Three-level garden residence</span></div>

<aside id="panel" class="frost" aria-live="polite">
  <div class="eyebrow">Level</div>
  <div class="num" id="p-num"></div>
  <h1 id="p-name"></h1>
  <p class="rooms" id="p-rooms"></p>
  <p class="note" id="p-note"></p>
  <dl>
    <div><dt>This level</dt><dd id="p-area"></dd></div>
    <div><dt>Whole house</dt><dd>427 m²</dd></div>
    <div><dt>Land</dt><dd>3,480 m²</dd></div>
    <div><dt>Guide price</dt><dd>$8.4M</dd></div>
  </dl>
  <button id="enter" type="button">Step inside</button>
  <a class="ghost" href="tour.html#garden">Walk through the house</a>
  <p class="hint" id="hint"></p>
</aside>

<div id="room" role="dialog" aria-modal="true" aria-labelledby="c-name" aria-hidden="true">
  <img id="r-img" alt="">
  <div id="card" class="frost">
    <div class="eyebrow">Orbis House · Level</div>
    <div class="num" id="c-num"></div>
    <h1 id="c-name"></h1>
    <p class="rooms" id="c-rooms"></p>
    <button id="back" type="button">← Back to house</button>
    <a class="ghost" id="walk" href="tour.html">Walk this level</a>
  </div>
</div>

<script src="floors.js"></script>
<script>
// One entry per level, level 1 first. FLOORS (floors.js) holds the matching outlines in image pixels.
const LEVELS = [
  // `spot` is where "Walk this level" drops you in tour.html.
  { name: "Living Pavilion", rooms: "Living · Dining · Kitchen", area: 135, img: "level-1.jpg", spot: "living",
    note: "Glazed on two sides onto the pool terrace, with the spiral stair and lift at its heart." },
  { name: "Garden Suite", rooms: "Bedroom suite · Landing lounge · Study", area: 184, img: "level-2.jpg", spot: "bedroom",
    note: "Cantilevers three metres over the terrace with a wrap-around balcony." },
  { name: "Sky Suite", rooms: "Master suite · Lounge · Roof terrace", area: 108, img: "level-3.jpg", spot: "master",
    note: "The stair arrives beside the bed; glass opens onto the roof terrace and fire pit." },
];
const ZOOM = 3;

const $ = id => document.getElementById(id);
const svg = $("stage"), lead = $("lead"), panel = $("panel"), room = $("room");
const reduced = matchMedia("(prefers-reduced-motion: reduce)");
const centre = pts => [0, 1].map(k => pts.reduce((s, p) => s + p[k], 0) / pts.length);
let cur = -1, isOpen = false, timer = 0;

const polys = FLOORS.map(pts => {
  const p = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
  p.setAttribute("points", pts.map(q => q.join(",")).join(" "));
  p.setAttribute("class", "floor");
  svg.insertBefore(p, lead);
  return p;
});

function drawLead() {
  if (cur < 0) return;
  const right = [...FLOORS[cur]].sort((a, b) => b[0] - a[0]).slice(0, 2);   // the level's right-hand edge
  const r = panel.getBoundingClientRect();
  const end = new DOMPoint(r.left, r.top + 84).matrixTransform(svg.getScreenCTM().inverse());
  const x1 = right[0][0], y1 = (right[0][1] + right[1][1]) / 2;
  lead.style.visibility = end.x > x1 ? "visible" : "hidden";
  [["x1", x1], ["y1", y1], ["x2", end.x], ["y2", end.y]].forEach(([k, v]) => lead.setAttribute(k, v));
}

// Crop the picture around the house instead of the image centre, and pick side panel or bottom sheet.
const xs = FLOORS.flat().map(p => p[0]), houseL = Math.min(...xs), houseR = Math.max(...xs);
const SIDE = 400;   // CSS px taken by the side panel and its margins
function fit() {
  const sheet = innerWidth <= 720 || (innerWidth - SIDE) * 1080 / innerHeight < houseR - houseL + 80;
  document.body.classList.toggle("sheet", sheet);
  const h = sheet ? innerHeight - panel.offsetHeight - 24 : innerHeight;   // the sheet docks under the picture
  svg.style.height = h + "px";
  const k = 1080 / h;                              // image units per CSS px when the height fills the picture
  const vw = Math.min(1920, innerWidth * k);       // visible width in image units
  const free = sheet ? vw : vw - SIDE * k;
  const x0 = Math.max(0, Math.min(1920 - vw, (houseL + houseR) / 2 - free / 2));
  svg.setAttribute("viewBox", x0 + " 0 " + vw + " 1080");
  drawLead();
}

function select(i) {
  i = Math.max(0, Math.min(LEVELS.length - 1, i));
  if (i === cur) return;
  cur = i;
  const L = LEVELS[i], num = String(i + 1).padStart(2, "0");
  polys.forEach((p, k) => p.classList.toggle("on", k === i));
  $("p-num").textContent = $("c-num").textContent = num;
  $("p-name").textContent = $("c-name").textContent = L.name;
  $("p-rooms").textContent = $("c-rooms").textContent = L.rooms + " · " + L.area + " m²";
  $("p-note").textContent = L.note;
  $("p-area").textContent = L.area + " m²";
  svg.setAttribute("aria-valuenow", i + 1);
  svg.setAttribute("aria-valuetext", "Level " + (i + 1) + ", " + L.name);
  fit();   // the sheet's height can change with the text
}

function openRoom() {
  if (isOpen || cur < 0) return;
  isOpen = true;
  $("r-img").src = LEVELS[cur].img;
  $("r-img").alt = "Interior of level " + (cur + 1) + ", " + LEVELS[cur].name;
  $("walk").href = "tour.html#" + LEVELS[cur].spot;
  if (!reduced.matches) {
    const c = new DOMPoint(...centre(FLOORS[cur])).matrixTransform(svg.getScreenCTM());
    svg.style.transformOrigin = c.x + "px " + c.y + "px";
    svg.style.transform = "scale(" + ZOOM + ")";
  }
  document.body.classList.add("zooming");
  timer = setTimeout(() => {
    room.classList.add("open");
    room.setAttribute("aria-hidden", "false");
    $("back").focus();
  }, reduced.matches ? 0 : 1000);
}

function closeRoom() {
  if (!isOpen) return;
  isOpen = false;
  clearTimeout(timer);
  room.classList.remove("open");
  room.setAttribute("aria-hidden", "true");
  svg.style.transform = "";
  document.body.classList.remove("zooming");
  svg.focus({ preventScroll: true });
}

// Mouse: hover selects, click opens.
polys.forEach((p, i) => {
  p.addEventListener("pointerenter", e => { if (e.pointerType === "mouse" && !isOpen) select(i); });
  p.addEventListener("pointerup", e => { if (e.pointerType === "mouse" && e.button === 0) { select(i); openRoom(); } });
});

// Touch: finger height picks the level, even off the house; a tap on the level that was already lit opens it.
const levelAt = clientY => {
  const y = new DOMPoint(0, clientY).matrixTransform(svg.getScreenCTM().inverse()).y;
  return FLOORS.map((pts, i) => [Math.abs(centre(pts)[1] - y), i]).sort((a, b) => a[0] - b[0])[0][1];
};
let touch = null;
svg.addEventListener("pointerdown", e => {
  if (e.pointerType === "mouse" || isOpen) return;
  touch = { was: cur, y: e.clientY, moved: false };
  svg.setPointerCapture(e.pointerId);
  select(levelAt(e.clientY));
});
svg.addEventListener("pointermove", e => {
  if (!touch) return;
  if (Math.abs(e.clientY - touch.y) > 8) touch.moved = true;
  select(levelAt(e.clientY));
});
svg.addEventListener("pointerup", e => {
  if (!touch) return;
  const tapOnLit = !touch.moved && touch.was === cur && document.elementFromPoint(e.clientX, e.clientY) === polys[cur];
  touch = null;
  if (tapOnLit) openRoom();
});
svg.addEventListener("pointercancel", () => { touch = null; });

// Keyboard: the picture is a slider.
svg.addEventListener("keydown", e => {
  const step = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key];
  if (step) select(cur + step);
  else if (e.key === "Home") select(0);
  else if (e.key === "End") select(LEVELS.length - 1);
  else if (e.key === "Enter" || e.key === " ") openRoom();
  else return;
  e.preventDefault();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeRoom(); });
$("enter").addEventListener("click", openRoom);
$("back").addEventListener("click", closeRoom);
addEventListener("resize", fit);

$("hint").textContent = matchMedia("(hover: none)").matches
  ? "Drag up and down to choose a level, then tap it again"
  : "Hover a level, click to step inside · arrow keys work too";
LEVELS.forEach(L => { new Image().src = L.img; });
console.assert(FLOORS.length === LEVELS.length, "floors.js and LEVELS disagree on the number of levels");
select(1);
</script>
</body>
</html>
